AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Monday Briefing API - FastAPI sur AWS Lambda

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        # Configuration de localisation (non-sensible)
        LATITUDE: "48.8566"
        LONGITUDE: "2.3522"
        TIMEZONE: "Europe/Paris"
        
        # Configuration équipe de football (non-sensible)
        TEAM_ID: "524"
        TEAM_NAME: "Paris Saint-Germain"
        
        # Les secrets (SMTP, API keys) sont maintenant dans Secrets Manager
        # Ils seront chargés automatiquement par le code depuis monday-briefing/prod/config

Resources:
  MondayBriefingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MondayBriefingAPI
      Handler: lambda_handler.lambda_handler
      CodeUri: .
      Description: API FastAPI pour génération de briefing hebdomadaire
      Architectures:
        - x86_64
      Events:
        # API Gateway HTTP pour tous les endpoints
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        # EventBridge: Déclencher tous les lundis à 8h (heure Paris)
        MondaySchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 7 ? * MON *)' # tous les lundis à 7h UTC = 8h Paris
            # Schedule: 'cron(0 7 ? * * *)' #tous les jours à 7h UTC = 8h Paris
            Description: "Envoi automatique du briefing tous les lundis à 8h (heure Paris = 7h UTC)"
            Enabled: true
            Input: '{"source": "eventbridge", "action": "send_briefing"}'
      Policies:
        - AWSLambdaBasicExecutionRole
        # Ajout de permissions pour Secrets Manager
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:monday-briefing/*'

Outputs:
  MondayBriefingApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  MondayBriefingFunction:
    Description: "Lambda Function ARN"
    Value: !GetAtt MondayBriefingFunction.Arn
  MondayBriefingFunctionIamRole:
    Description: "IAM Role pour Lambda"
    Value: !GetAtt MondayBriefingFunctionRole.Arn
